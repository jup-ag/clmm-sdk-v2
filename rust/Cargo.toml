[package]
name = "crema-clmm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
uint = "0.9.1"
spl-token-interface = "1.0"
thiserror = "1.0.31"
anyhow = "1.0"
serde = "1.0.140"
lazy_static = "1.2.0"
bs58 = "0.5.1"
rust_decimal = { version = ">=1.26.1", features = ["maths"] }
solana-rpc-client = "2"
solana-instruction = "2.3"
solana-pubkey = { version = "2.3", features = ["curve25519", "borsh"] }
borsh = { version = "0.10", features = ["const-generics"] }
sha2 = "0.10.2"
