[package]
name = "crema-clmm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anchor-lang = "1.0.0"
uint = "0.9.1"
spl-token-interface = "2.0.0"
thiserror = "1.0.31"
anyhow = "1.0"
serde_json = "1.0.82"
serde = "1.0.140"
lazy_static = "1.2.0"
rust_decimal = { version = ">=1.26.1", features = ["maths"] }
solana-commitment-config = "3.1.1"
solana-program = "4.0.0"
solana-pubkey = { version = "4.2.0", features = ["borsh"] }
solana-rpc-client = "4.1.2"
# jupiter = { path = "./jupiter" }
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5.1"
sha2 = "0.10.2"
